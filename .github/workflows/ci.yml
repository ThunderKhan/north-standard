name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell capture scripts syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python reference package
        run: python -m pip install -e .

      - name: Configure C++ verifier
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build C++ verifier
        run: cmake --build build --parallel 2

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Python and differential tests
        env:
          NORTH_STANDARD_CPP_CLI: build/cpp/north-standard-cpp
        run: python -m unittest discover -s tests -v

      - name: Run synthetic experiment smoke matrix
        run: |
          python experiments/run_synthetic.py \
            --trials-per-scenario 4 \
            --base-seed 20260907 \
            --output-dir /tmp/north-standard-synthetic-smoke

      - name: Run baseline and ablation smoke comparison
        run: |
          python experiments/compare_evaluators.py \
            --trials-per-scenario 2 \
            --base-seed 20260907 \
            --output-dir /tmp/north-standard-evaluator-comparison

      - name: Run challenge-aware cheating smoke comparison
        run: |
          python experiments/challenge_aware.py \
            --trials-per-schedule 20 \
            --base-seed 20260907 \
            --challenge-count 6 \
            --output-dir /tmp/north-standard-challenge-aware

      - name: Run held-out protocol smoke check
        run: |
          python experiments/run_heldout.py \
            --calibration-trials-per-scenario 2 \
            --heldout-trials-per-scenario 5 \
            --output-dir /tmp/north-standard-heldout

      - name: Run challenge sensitivity smoke grid
        run: |
          python experiments/challenge_sensitivity.py \
            --challenge-counts 2,6 \
            --honesty-radii-seconds 2,5 \
            --jitter-values-seconds 10,20 \
            --trials-per-cell 6 \
            --output-dir /tmp/north-standard-challenge-sensitivity

      - name: Generate verifier-to-settlement fixtures
        env:
          NORTH_STANDARD_CPP_CLI: build/cpp/north-standard-cpp
        run: python scripts/generate_settlement_fixture.py --require-cpp

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Solidity settlement tests
        run: forge test -vvv
